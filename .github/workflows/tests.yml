name: Python tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (needed by the live Stage6 matrix)
        run: |
          choco install ffmpeg -y --no-progress
          # Put the real ffmpeg.exe/ffprobe.exe ahead of Chocolatey's shims:
          # terminating a shim on cancel leaves its child ffmpeg running and
          # holding the partial output file open.
          $bin = (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "real ffmpeg.exe not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\ffmpeg.exe" -version
          & "$bin\ffprobe.exe" -version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -rs
