name: Python tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (needed by the live Stage6 matrix)
        run: |
          # The community feed has transient outages (HTTP 406/503): retry.
          foreach ($attempt in 1..4) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 4) { throw "choco install ffmpeg failed" }
            Start-Sleep -Seconds (20 * $attempt)
          }
          # Put the real ffmpeg.exe/ffprobe.exe ahead of Chocolatey's shims:
          # terminating a shim on cancel leaves its child ffmpeg running and
          # holding the partial output file open.
          $bin = (Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "real ffmpeg.exe not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\ffmpeg.exe" -version
          & "$bin\ffprobe.exe" -version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -rs
